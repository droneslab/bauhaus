dataset: EUROC

# Camera calibration and distortion parameters
fx: 458.654
fy: 457.296
cx: 367.215
cy: 248.375
k1: -0.28340811
k2: 0.07395907
p1: 0.00019359
p2: 1.76187114e-05
k3: 0.0

stereo_baseline_times_fx: 386.1448
thdepth: 35

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
RGB: 1

# Camera resolution
width: 752
height: 480
# NOTE: Turn these on for orbslam pipeline to get the same results as orbslam
# new_width: 600
# new_height: 350
stereo_overlapping_begin: 0
stereo_overlapping_end: 1000

# Transformation from camera to body-frame (imu)
imu__T_b_c1_row1: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975]
imu__T_b_c1_row2: [0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768]
imu__T_b_c1_row3: [-0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949]
imu__T_b_c1_row4: [0.0, 0.0, 0.0, 1.0]

# IMU noise
# FROM ORBSLAM:
# imu__noise_gyro: 1.6968e-04 #1.7e-4
# imu__noise_acc: 1.9393e-05 #2.0000e-3
# imu__gyro_walk: 2.0000e-3 #1.9393e-05 
# imu__acc_walk: 3.0000e-03
# imu__frequency: 200.0

# FROM VINSMONO:
# imu__noise_acc: 0.1          # accelerometer measurement noise standard deviation. #0.2   0.04
# imu__noise_gyro: 0.01         # gyroscope measurement noise standard deviation.     #0.05  0.004
# imu__acc_walk: 0.001         # accelerometer bias random work noise standard deviation.  #0.02
# imu__gyro_walk: 0.0001       # gyroscope bias random work noise standard deviation.     #4.0e-5
# imu__frequency: 200.0

# FROM KIMERA:
imu__noise_gyro: 1.6968e-04     # [ rad / s / sqrt(Hz) ]   ( gyro "white noise" )
imu__gyro_walk: 0.5e-05       # [ rad / s^2 / sqrt(Hz) ] ( gyro bias diffusion )
imu__noise_acc: 2.0000e-3  # [ m / s^2 / sqrt(Hz) ]   ( accel "white noise" )
imu__acc_walk: 3.0000e-2    # [ m / s^3 / sqrt(Hz) ]  ( accel bias diffusion ) Default in Euroc: 3.0000e-3
imu__frequency: 200.0


####### Kimera #######
subpixelRefinementStereo: 0
useSuccessProbabilities: 1
useRANSAC: 1
minNrMonoInliers: 10
minNrStereoInliers: 5
ransac_threshold_mono: 1e-06
ransac_threshold_stereo: 1
ransac_use_1point_stereo: 1
ransac_use_2point_mono: 1
ransac_max_iterations: 100
ransac_probability: 0.995
ransac_randomize: 0
min_intra_keyframe_time: 0.2
max_intra_keyframe_time: 10.0
max_disparity_since_lkf: 200
minNumberFeatures: 0
useStereoTracking: 0
disparityThreshold: 0.5
# Type of optical flow predictor to aid feature tracking:
# 0: Static - assumes no optical flow between images (aka static camera).
# 1: Rotational - use IMU gyro to estimate optical flow.
optical_flow_predictor_type: 1

# 2D-2D pose estimation method
use_2d2d_tracking: 1
2d2d_algorithm: 1 # Nister
optimize_2d2d_pose_from_inliers: 0

# 3D-3D pose estimation
use_3d3d_tracking: 0
optimize_3d3d_pose_from_inliers: 0

# 2D-3D pose estimation method
use_pnp_tracking: 0
pnp_algorithm: 3 # EPNP
min_pnp_inliers: 10
ransac_threshold_pnp: 1.0 # pixels
optimize_2d3d_pose_from_inliers: 0




# ISAM2 Initialization Parameters
initialPositionSigma: 1e-05
initialRollPitchSigma: 0.174533 # 10.0/180.0*M_PI
initialYawSigma: 0.00174533 # 0.1/180.0*M_PI
initialVelocitySigma: 0.001
initialAccBiasSigma: 0.1
initialGyroBiasSigma: 0.01
imu_integration_sigma: 1.0e-8
imu_bias_init_sigma: 1e-3


