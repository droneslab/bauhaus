# Validate yaml with: https://yamlchecker.com/

master:
       name: manager
       address: localhost
       file: main.rs

system:
      localization_only_mode: false
      vocabulary_file: "../Vocabulary/ORBvoc.txt"
      framesensor: Mono
      imusensor: Some
      first_actor_name: TRACKING_FRONTEND # Name of actor to kick off pipeline

      # FPS
      fps: 10.0

      # KIMERA
      # 1100, 482
      initial_k: 51 # Start processing dataset from frame initial_k. Useful to skip a bunch of images at the beginning (imu calibration).
      final_k: 0 # Finish processing dataset at frame final_k. Last frame to process (to avoid processing the entire dataset), skip last frames. If set to 0 will process everything. 

      # RESULTS
      results_folder: "results"
      camera_trajectory_file_name: "camera_trajectory.txt"
      keyframe_trajectory_file_name: "keyframe_trajectory.txt"

      # DEBUGGING
      log_level: debug # options are [trace, debug, info, warn, error]
      check_deadlocks: false # Spawns a new thread to check for deadlocks every 2 secs, but slows stuff down.
      # To enable profiling, set features = ["enable"] for tracy-client in Cargo.toml
      # To turn on visualizer, uncomment visualizer actor below

modules:
      # - 
      #   name: FEATURE_DETECTION
      #   tag: "good features to track" # options: ["opencv feature detection", "orbslam feature detection", "good features to track"]
      #   settings:
      #     - 

      - name: FEATURE_DETECTION
        tag: "orbslam feature detection" # options: ["opencv feature detection", "orbslam feature detection", "good features to track"]
        settings:
          - name: max_features
            value: 1000 #1000 in euroc, 2000 in kitti
            type: i32
          - name: ini_features
            value: 5000 # 5000 in euroc, 10000 in kitti
            type: i32
          - name: scale_factor
            value: 1.2
            type: f64
          - name: n_levels
            value: 8
            type: i32
          - name: ini_th_fast
            value: 20
            type: i32
          - name: min_th_fast
            value: 7
            type: i32


      - name: FEATURE_MATCHER
        tag: "orbslam feature matching"
        settings:
          - name: far_points_threshold
            value: 20.0
            type: f64
          - name: high_threshold
            value: 100
            type: i32
          - name: low_threshold
            value: 50
            type: i32
          - name: histo_length
            value: 30
            type: i32

      - name: FEATURES
        tag: "features"
        settings:
          - name: frame_grid_rows
            value: 48
            type: i32
          - name: frame_grid_cols
            value: 64
            type: i32

      - name: LOOP_DETECTION
        tag: "orbslam3 loop detection"
        settings:
          - 

      - name: LOCAL_MAP_OPTIMIZATION
        tag: "bundle adjustment"
        settings:
          - 

      - name: FULL_MAP_OPTIMIZATION
        tag: "bundle adjustment"
        settings:
          - 

actors:
      - name: VISUALIZER
        tag: visualizer
        receiver_bound: -1
        settings:
          - name: stream # if true, stream to websocket. if false, save to mcap file
            value: true
            type: bool
          - name: port # port used if streaming
            value: 8765
            type: i32
          - name: image_draw_type
            value: plain # options are [none, plain, features, featuresandmatches]
            type: string
          - name: mcap_file_path
            value: "results/out.mcap"
            type: string
          - name: draw_all_mappoints # Not sure this works right now... If true, draws all mappoints in the map. If false, only draws matches and recently created mappoints. Set to false to save space.
            value: false
            type: bool
          - name: draw_local_mappoints # Whether to draw local mappoints (not tracked, but in local map based on local keyframes)
            value: true
            type: bool
          - name: draw_graph # Works but doesn't look good. Need to figure out some nicer way to distribute the points so it's actually readable
            value: false
            type: bool
          - name: draw_only_trajectory
            value: false
            type: bool
  
      - name: TRACKING_FRONTEND
        tag: "gtsam tracking frontend"
        receiver_bound: 10
        settings:
          # Good features to track parameters
          - name: gftt_k
            value: 0.04
            type: f64
          - name: gftt_block_size
            value: 3
            type: i32
          - name: gftt_quality_level
            value: 0.001
            type: f64
          - name: gftt_max_features # max feature number in feature tracking
            value: 300
            type: i32
          - name: gftt_use_harris_corner_detector
            value: false
            type: bool
          - name: gftt_min_distance_btw_tracked_and_detected_features
            value: 20
            type: i32

          # Optical flow parameters
          - name: opticalflow_winsize
            value: 24
            type: i32
          - name: opticalflow_maxlevel
            value: 4
            type: i32
          - name: opticalflow_maxiter
            value: 30
            type: i32
          - name: opticalflow_epsilon
            value: 0.1
            type: f64
          - name: opticalflow_termcriteriatype
            value: 3 # COUNT (1), EPS (2), or COUNT + EPS (3)
            type: i32
          - name: opticalflow_maxfeatureage
            value: 24
            type: i32

          # Non-max suppression parameters
          - name: nonmaxsuppression__max_nr_keypoints_before_anms
            value: 2000
            type: i32
          - name: nonmaxsuppression__nr_horizontal_bins
            value: 7
            type: i32
          - name: nonmaxsuppression__nr_vertical_bins
            value: 5
            type: i32

          # Subpixel corner refinement for the monocular case
          - name: subpix_max_iters
            value: 40
            type: i32
          - name: subpix_epsilon_error
            value: 0.001
            type: f64
          - name: subpix_window_size
            value: 10
            type: i32
          - name: subpix_zero_zone
            value: -1
            type: i32
          - name: subpix_termcriteriatype
            value: 3
            type: i32

          # Geometric outlier rejection
          - name: ransac_max_iterations
            value: 100
            type: i32
          - name: ransac_threshold_mono
            value: 1e-06
            type: f64
          - name: min_nr_mono_inliers
            value: 10
            type: i32
          - name: ransac_probability
            value: 0.995
            type: f64

          # Need new KF decision
          - name: min_intra_keyframe_time_ns
            value: 200000000.0
            type: f64
          - name: max_intra_keyframe_time_ns
            value: 10000000000.0
            type: f64
          - name: min_num_features
            value: 0
            type: i32
          - name: max_disparity_since_lkf
            value: 200.0
            type: f64
          - name: disparity_threshold
            value: 0.5
            type: f64

      - name: TRACKING_BACKEND
        tag: "gtsam tracking backend"
        receiver_bound: 10
        settings:
          - name: use_smart_factors # If false, will use genericfactors
            value: true
            type: bool
          - name: optimizer_type # 0: ISAM2, 1: IncrementalFixedLagSmoother, 2: LevenbergMarquardt
            value: 1
            type: i32
          - name: isam_update_interval
            value: 0
            type: i32
          - name: isam_relinearize_threshold
            value: 0.01
            type: f64
          - name: isam_relinearize_skip
            value: 1
            type: i32
          - name: isam_cache_linearized_factors
            value: true
            type: bool
          - name: isam_enable_detailed_results
            value: true
            type: bool
          - name: isam_find_unused_factor_slots
            value: true
            type: bool
          - name: isam_wildfire_threshold
            value: 0.001
            type: f64
          - name: isam_nr_states # number of nodes in horizon
            value: 25
            type: i32
          - name: zero_velocity_precision
            value: 1000.0
            type: f64
          - name: no_motion_rotation_precision
            value: 10000.0
            type: f64
          - name: no_motion_position_precision
            value: 10000.0
            type: f64

      - name: LOCAL_MAPPING
        tag: "gtsam local mapping"
        receiver_bound: 3
        settings:
          - 

      # -
      #  name: LOOP_CLOSING
      #  tag: "orbslam3 loop closing"
      #  receiver_bound: -1
      #  settings:
      #     - 
